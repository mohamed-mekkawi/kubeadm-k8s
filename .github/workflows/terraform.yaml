
name: Terraform Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose Terraform action"
        required: true
        type: choice
        options:
          - apply
          - destroy
        default: apply

permissions:
  contents: read

concurrency:
  group: terraform-k8s-infrastructure
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  TF_IN_AUTOMATION: true

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"

      # 3. Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 4. Verify AWS identity
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # 5. Initialize Terraform and connect to S3
      - name: Terraform Init
        run: terraform init -input=false -lock-timeout=5m

      # 6. Validate Terraform configuration
      - name: Terraform Validate
        run: terraform validate

      # 7. Create Apply Plan
      - name: Terraform Plan
        if: inputs.action == 'apply'
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      # 8. Apply infrastructure
      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false -lock-timeout=5m -auto-approve tfplan

      # 9. Create Destroy Plan
      - name: Terraform Destroy Plan
        if: inputs.action == 'destroy'
        run: terraform plan -destroy -input=false -lock-timeout=5m -out=tfplan

      # 10. Destroy infrastructure
      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        run: terraform apply -input=false -lock-timeout=5m -auto-approve tfplan

      # 11. Show final Terraform state
      - name: Show Terraform State
        if: always() && steps.init.outcome == 'success'
        run: terraform state list
        continue-on-error: true
        id: state
