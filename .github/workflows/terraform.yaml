
name: Terraform Infrastructure

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yaml"

  workflow_dispatch:
    inputs:
      action:
        description: "plan = dry run | apply = create/update | destroy = delete everything"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

      configure_cluster:
        description: "After apply, build the Kubernetes cluster (runs the Ansible workflow)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# One run at a time against the same state.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('terraform-pr-{0}', github.ref) || 'terraform-k8s-infrastructure' }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  TF_VERSION: "1.15.9"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:

  # ---------------------------------------------------------------------------
  # 1. Static checks - no cloud credentials needed
  # ---------------------------------------------------------------------------

  validate:
    name: Validate and scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive -diff

      - name: Terraform init (no backend)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      # Checkov Security Scan
      - name: Security scan (Checkov)
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: terraform
          framework: terraform
          output_format: cli
          soft_fail: false
          quiet: false

  # ---------------------------------------------------------------------------
  # 2. Plan - always runs for manual runs
  # ---------------------------------------------------------------------------

  plan:
    name: Terraform plan (${{ inputs.action }})
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init -lock-timeout=5m

      - name: Assert S3 remote backend is active
        run: |
          TYPE=$(jq -r '.backend.type // "local"' .terraform/terraform.tfstate)

          if [ "$TYPE" != "s3" ]; then
            echo "::error::Backend is '$TYPE', expected 's3'. Is terraform/backend.tf present?"
            exit 1
          fi

      - name: Guard - refuse to destroy an empty state
        if: inputs.action == 'destroy'
        run: |
          COUNT=$(terraform state pull | jq '[.resources[]?.instances[]?] | length')

          echo "Resources in remote state: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Remote state is empty - nothing to destroy (or the wrong state is attached)."
            exit 1
          fi

      - name: Terraform Plan
        env:
          DESTROY_FLAG: ${{ inputs.action == 'destroy' && '-destroy' || '' }}
        run: |
          # shellcheck disable=SC2086
          terraform plan $DESTROY_FLAG -lock-timeout=5m -out=tfplan

          terraform show -no-color tfplan > plan.txt

      - name: Publish plan to job summary
        run: |
          {
            echo "### Terraform plan: ${{ inputs.action }}"
            echo '```'
            head -c 100000 plan.txt
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        if: inputs.action != 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3a. Apply
  # ---------------------------------------------------------------------------

  apply:
    name: Terraform apply
    needs: plan
    if: inputs.action == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -lock-timeout=5m

      - name: Download reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      - name: Terraform Apply
        run: terraform apply -lock-timeout=5m tfplan

      - name: Show outputs and state
        if: always()
        run: |
          terraform output || true
          terraform state list || true

  # ---------------------------------------------------------------------------
  # 3b. Destroy
  # ---------------------------------------------------------------------------

  destroy:
    name: Terraform destroy
    needs: plan
    if: inputs.action == 'destroy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-destroy

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -lock-timeout=5m

      - name: Download reviewed destroy plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      - name: Terraform Destroy
        run: terraform apply -lock-timeout=5m tfplan

      - name: Show remaining state
        if: always()
        run: terraform state list || true

  # ---------------------------------------------------------------------------
  # 4. Configure Kubernetes cluster using Ansible
  # ---------------------------------------------------------------------------

  configure-cluster:
    name: Configure cluster (Ansible)
    needs: apply
    if: inputs.action == 'apply' && inputs.configure_cluster

    permissions:
      contents: read

    uses: ./.github/workflows/ansible.yaml
    secrets: inherit
