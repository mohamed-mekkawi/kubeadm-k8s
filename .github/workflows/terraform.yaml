
name: Terraform Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: Choose Terraform action
        type: choice
        options:
          - apply
          - destroy
        default: apply
        required: true

permissions:
  contents: read

concurrency:
  group: terraform-k8s-cluster
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: eu-west-1

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" \
            --profile user-terraform
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" \
            --profile user-terraform
          aws configure set region "$AWS_DEFAULT_REGION" \
            --profile user-terraform

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      # حماية: لا نسمح بالعمل على بنية موجودة
      # إلا لو الـ Remote State متابع مواردها بالفعل.
      - name: Verify Remote State
        run: |
          terraform state pull > "$RUNNER_TEMP/terraform.tfstate"

          COUNT=$(jq '[.resources[]?.instances[]?] | length' \
            "$RUNNER_TEMP/terraform.tfstate")

          echo "Managed resources in state: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No managed resources found in S3 state."
            echo "Recover or import existing resources before continuing."
            exit 1
          fi

          terraform state list

      - name: Terraform Plan
        if: inputs.action == 'apply'
        run: |
          RUNNER_IP=$(curl -4 -s https://api.ipify.org)

          terraform plan -input=false \
            -var "runner_ip=${RUNNER_IP}/32"

      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: |
          RUNNER_IP=$(curl -4 -s https://api.ipify.org)

          terraform apply -input=false -auto-approve \
            -var "runner_ip=${RUNNER_IP}/32"

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        run: |
          terraform plan -destroy -input=false
          terraform destroy -input=false -auto-approve
