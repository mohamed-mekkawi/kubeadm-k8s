
name: Ansible Kubernetes Setup

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ansible-k8s-setup
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1

jobs:
  ansible:
    name: Configure Kubernetes Servers
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Prerequisites
        run: |
          set -euo pipefail

          command -v jq
          command -v ssh
          command -v python3

      - name: Validate SSH Key
        run: |
          KEY="$HOME/.ssh/key.pem"

          test -r "$KEY" || {
            echo "::error::$KEY not found on self-hosted runner"
            exit 1
          }

          chmod 600 "$KEY"
          ssh-keygen -y -f "$KEY" > /dev/null

          echo "ANSIBLE_PRIVATE_KEY_FILE=$KEY" >> "$GITHUB_ENV"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false -lock-timeout=5m

      - name: Read Terraform Outputs
        working-directory: terraform
        run: |
          terraform output -json > "$RUNNER_TEMP/tf-outputs.json"

          jq -e '(.public_ips.value // {}) | length > 0' \
            "$RUNNER_TEMP/tf-outputs.json" > /dev/null

      - name: Generate Ansible Inventory
        working-directory: ansible
        run: |
          bash gen_inventory.sh \
            < "$RUNNER_TEMP/tf-outputs.json" \
            > inventory.json

      - name: Configure Servers
        working-directory: ansible
        run: |
          ansible-playbook hostname.yaml

      - name: Cleanup
        if: always()
        run: |
          rm -f ansible/inventory.json
          rm -f "$RUNNER_TEMP/tf-outputs.json"
