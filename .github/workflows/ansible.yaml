
name: Ansible Kubernetes Setup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ansible-k8s-setup
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: eu-west-1
  ANSIBLE_HOST_KEY_CHECKING: "False"

jobs:
  ansible:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" \
            --profile new-user
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" \
            --profile new-user
          aws configure set region "$AWS_DEFAULT_REGION" \
            --profile new-user

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      - name: Get EC2 IPs
        working-directory: terraform
        run: |
          IPS=$(terraform output -json public_ips)

          MASTER_PUBLIC=$(echo "$IPS" | jq -r '.master')
          WORKER1_PUBLIC=$(echo "$IPS" | jq -r '.worker1')
          WORKER2_PUBLIC=$(echo "$IPS" | jq -r '.worker2')
          MASTER_PRIVATE=$(terraform output -raw master_private_ip)

          echo "MASTER_PUBLIC=$MASTER_PUBLIC" >> "$GITHUB_ENV"
          echo "WORKER1_PUBLIC=$WORKER1_PUBLIC" >> "$GITHUB_ENV"
          echo "WORKER2_PUBLIC=$WORKER2_PUBLIC" >> "$GITHUB_ENV"
          echo "MASTER_PRIVATE=$MASTER_PRIVATE" >> "$GITHUB_ENV"

      - name: Install SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/key-mo.pem
          chmod 400 ~/.ssh/key-mo.pem

      - name: Configure Ansible Inventory
        run: |
          sed -i \
            -e "s/MASTER_PUBLIC_IP/$MASTER_PUBLIC/g" \
            -e "s/MASTER_PRIVATE_IP/$MASTER_PRIVATE/g" \
            -e "s/WORKER1_PUBLIC_IP/$WORKER1_PUBLIC/g" \
            -e "s/WORKER2_PUBLIC_IP/$WORKER2_PUBLIC/g" \
            ansible/inventory.yaml

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Run Ansible Playbook
        working-directory: ansible
        run: |
          ansible-playbook -i inventory.yaml hostname.yaml
