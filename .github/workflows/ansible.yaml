
name: Ansible Kubernetes Setup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ansible-k8s-setup
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: eu-west-1
  AWS_PROFILE: new-user
  ANSIBLE_HOST_KEY_CHECKING: "False"

jobs:
  ansible:
    runs-on: self-hosted

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install Dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3-pip python3-venv openssh-client

      # 3. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # 4. Configure AWS
      - name: Configure AWS
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" \
            --profile new-user

          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" \
            --profile new-user

          aws configure set region "$AWS_DEFAULT_REGION" \
            --profile new-user

      # 5. Terraform Init
      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -input=false

      # 6. Get EC2 IPs
      - name: Get EC2 IPs
        working-directory: terraform
        run: |
          IPS=$(terraform output -json public_ips)

          MASTER_PUBLIC=$(echo "$IPS" | jq -r '.master')
          WORKER1_PUBLIC=$(echo "$IPS" | jq -r '.worker1')
          WORKER2_PUBLIC=$(echo "$IPS" | jq -r '.worker2')

          MASTER_PRIVATE=$(terraform output -raw master_private_ip)

          echo "MASTER_PUBLIC=$MASTER_PUBLIC" >> "$GITHUB_ENV"
          echo "WORKER1_PUBLIC=$WORKER1_PUBLIC" >> "$GITHUB_ENV"
          echo "WORKER2_PUBLIC=$WORKER2_PUBLIC" >> "$GITHUB_ENV"
          echo "MASTER_PRIVATE=$MASTER_PRIVATE" >> "$GITHUB_ENV"

      # 7. Install SSH Key
      - name: Install SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          test -n "$SSH_PRIVATE_KEY"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/key-mo.pem"

          chmod 400 "$HOME/.ssh/key-mo.pem"

          ssh-keygen -y -f "$HOME/.ssh/key-mo.pem" > /dev/null

          echo "SSH key validated successfully."

      # 8. Configure Ansible Inventory
      - name: Configure Ansible Inventory
        run: |
          sed -i \
            -e "s/MASTER_PUBLIC_IP/$MASTER_PUBLIC/g" \
            -e "s/MASTER_PRIVATE_IP/$MASTER_PRIVATE/g" \
            -e "s/WORKER1_PUBLIC_IP/$WORKER1_PUBLIC/g" \
            -e "s/WORKER2_PUBLIC_IP/$WORKER2_PUBLIC/g" \
            ansible/inventory.yaml

      # 9. Install Ansible
      - name: Install Ansible
        run: |
          python3 -m venv "$HOME/ansible-venv"
          "$HOME/ansible-venv/bin/pip" install --upgrade pip
          "$HOME/ansible-venv/bin/pip" install ansible

      # 10. Wait for SSH
      - name: Wait for SSH
        working-directory: ansible
        run: |
          "$HOME/ansible-venv/bin/ansible" all \
            -i inventory.yaml \
            -m ansible.builtin.wait_for_connection \
            -a "timeout=300 sleep=10"

      # 11. Ansible Ping
      - name: Ansible Ping
        working-directory: ansible
        run: |
          "$HOME/ansible-venv/bin/ansible" all \
            -i inventory.yaml \
            -m ping

      # 12. Run Ansible Playbook
      - name: Run Ansible Playbook
        working-directory: ansible
        run: |
          "$HOME/ansible-venv/bin/ansible-playbook" \
            -i inventory.yaml \
            hostname.yaml
