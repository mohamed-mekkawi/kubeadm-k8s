name: Ansible Kubernetes Setup

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ansible-k8s-setup
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1

jobs:
  ansible:
    name: Configure Kubernetes Servers
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Download project files
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Connect to AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # 4. Initialize Terraform S3 Backend
      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false -reconfigure

      # 5. Read existing infrastructure outputs
      - name: Get Terraform Outputs
        working-directory: terraform
        run: terraform output -json > outputs.json

      # 6. Install Ansible and PyYAML
      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible python3-yaml

      # 7. Configure SSH key
      - name: Setup SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/key-mo.pem
          chmod 600 ~/.ssh/key-mo.pem

      # 8. Generate Ansible YAML Inventory from Terraform outputs
      - name: Generate Inventory
        working-directory: terraform
        run: |
          python3 - <<'PY'
          import json
          import yaml

          with open("outputs.json") as f:
              outputs = json.load(f)

          public_ips = outputs["public_ips"]["value"]
          master_name = outputs["master_name"]["value"]
          master_private_ip = outputs["master_private_ip"]["value"]

          if master_name not in public_ips:
              raise ValueError(f"Master {master_name} not found in {list(public_ips)}")

          worker_names = sorted(n for n in public_ips if n != master_name)

          inventory = {
              "all": {
                  "vars": {
                      "ansible_user": "ubuntu",
                      "ansible_ssh_private_key_file": "~/.ssh/key-mo.pem",
                      "ansible_ssh_common_args": "-o StrictHostKeyChecking=accept-new",
                  },
                  "children": {
                      "master": {
                          "hosts": {
                              "master": {
                                  "ansible_host": public_ips[master_name],
                                  "private_ip": master_private_ip,
                              }
                          }
                      },
                      "workers": {
                          "hosts": {
                              f"worker{i}": {"ansible_host": public_ips[n]}
                              for i, n in enumerate(worker_names, start=1)
                          }
                      },
                  },
              }
          }

          with open("../ansible/inventory.yaml", "w") as f:
              yaml.safe_dump(inventory, f, sort_keys=False)

          print("Inventory generated successfully:")
          print(yaml.safe_dump(inventory, sort_keys=False))
          PY

      # 9. Test SSH connectivity (retry until EC2 is ready)
      - name: Test Ansible Connectivity
        working-directory: ansible
        run: |
          for i in {1..10}; do
            if ansible all -i inventory.yaml -m ping; then
              exit 0
            fi
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "SSH connectivity failed after 10 attempts"
          exit 1

      # 10. Run Ansible Playbook
      - name: Run Ansible Playbook
        working-directory: ansible
        run: |
          ansible-playbook -i inventory.yaml hostname.yaml