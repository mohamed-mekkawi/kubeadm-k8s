
name: Ansible Kubernetes Setup

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ansible-k8s-setup
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1

jobs:
  ansible:
    name: Configure Kubernetes Servers
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Download project files
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Connect to AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 4. Initialize Terraform S3 Backend
      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false -reconfigure

      # 5. Read existing infrastructure outputs
      - name: Get Terraform Outputs
        working-directory: terraform
        run: terraform output -json > outputs.json

      # 6. Install Ansible and PyYAML
      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          python3 -m pip install --user pyyaml --break-system-packages

      # 7. Configure SSH key
      - name: Setup SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/key-mo.pem
          chmod 600 ~/.ssh/key-mo.pem

      # 8. Generate Ansible YAML Inventory from Terraform outputs
     
      - name: Generate Inventory
        working-directory: terraform
        run: |
          python3 - <<'PY'
          import json
          import yaml

          with open("outputs.json") as f:
              outputs = json.load(f)

          public_ips = outputs["public_ips"]["value"]
          master_private_ip = outputs["master_private_ip"]["value"]

          master_name = None

          # Find master using its private IP
          for name, ip in public_ips.items():
              if ip == master_private_ip:
                  master_name = name
                  break

          if master_name is None:
              raise ValueError("Could not identify master node")

          worker_names = [
              name for name in public_ips
              if name != master_name
          ]

          inventory = {
              "all": {
                  "vars": {
                      "ansible_user": "ubuntu",
                      "ansible_ssh_private_key_file": "~/.ssh/key-mo.pem",
                      "ansible_ssh_common_args": "-o StrictHostKeyChecking=accept-new"
                  },
                  "children": {
                      "master": {
                          "hosts": {
                              master_name: {
                                  "ansible_host": public_ips[master_name]
                              }
                          }
                      },
                      "workers": {
                          "hosts": {
                              name: {
                                  "ansible_host": public_ips[name]
                              }
                              for name in worker_names
                          }
                      }
                  }
              }
          }

          with open("../ansible/inventory.yaml", "w") as f:
              yaml.safe_dump(inventory, f, sort_keys=False)

          print("Inventory generated successfully:")
          print(yaml.safe_dump(inventory, sort_keys=False))
          PY


      # 9. Test SSH connectivity
      - name: Test Ansible Connectivity
        working-directory: ansible
        run: |
          ansible all -i inventory.yaml -m ping

      # 10. Run Ansible Playbook
      - name: Run Ansible Playbook
        working-directory: ansible
        run: |
          ansible-playbook -i inventory.yaml hostname.yaml
