
name: Ansible Server Configuration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    name: Configure Servers
    runs-on: ubuntu-24.04

    env:
      AWS_REGION: eu-west-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ansible

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Get Server IPs
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform output -json > outputs.json

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem

      - name: Generate Inventory
        working-directory: ansible
        run: |
          bash gen_inventory.sh \
            < ../terraform/outputs.json \
            > inventory.json

      - name: Configure Servers
        working-directory: ansible
        run: |
          ansible-playbook \
            -i inventory.json \
            hostname.yaml \
            --private-key ~/.ssh/key.pem

      - name: Cleanup
        if: always()
        run: |
          rm -f terraform/outputs.json
          rm -f ansible/inventory.json
          rm -f ~/.ssh/key.pem
