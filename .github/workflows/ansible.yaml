
name: Ansible Kubernetes Setup

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ansible-k8s-setup
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1

jobs:
  ansible:
    name: Configure Kubernetes Servers
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Download project files
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Connect to AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 4. Initialize Terraform S3 Backend
      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false -reconfigure

      # 5. Read existing infrastructure outputs
      - name: Get Terraform Outputs
        working-directory: terraform
        run: terraform output -json > outputs.json

      # 6. Install Ansible
      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      # 7. Configure SSH key
      - name: Setup SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/key-mo.pem
          chmod 600 ~/.ssh/key-mo.pem

      # 8. Generate Ansible Inventory from Terraform outputs
      - name: Generate Inventory
        working-directory: terraform
        run: |
          python3 - <<'PY'
          import json

          with open("outputs.json") as f:
              outputs = json.load(f)

          public_ips = outputs["public_ips"]["value"]
          node_names = outputs["node_names"]["value"]

          master_name = node_names[0]

          if master_name not in public_ips:
              raise ValueError(f"Master node {master_name} not found in public_ips")

          master_ip = public_ips[master_name]

          worker_names = [
              name for name in node_names
              if name != master_name
          ]

          with open("../ansible/inventory.ini", "w") as f:
              f.write("[master]\n")
              f.write(f"{master_name} ansible_host={master_ip}\n\n")

              f.write("[workers]\n")
              for name in worker_names:
                  f.write(f"{name} ansible_host={public_ips[name]}\n")

              f.write("\n[all:vars]\n")
              f.write("ansible_user=ubuntu\n")
              f.write("ansible_ssh_private_key_file=~/.ssh/key-mo.pem\n")
              f.write("ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'\n")

          print("Inventory generated successfully:")
          print(open("../ansible/inventory.ini").read())
          PY

      # 9. Test SSH connectivity
      - name: Test Ansible Connectivity
        working-directory: ansible
        run: |
          ansible all -i inventory.ini -m ping

      # 10. Run Ansible Playbook
      - name: Run Ansible Playbook
        working-directory: ansible
        run: |
          ansible-playbook -i inventory.ini hostname.yaml
