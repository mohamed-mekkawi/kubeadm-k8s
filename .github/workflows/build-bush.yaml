
name: Build and Push Library Images

on:
  push:
    branches:
      - main
    paths:
      - "library/**"
      - ".github/workflows/build-push.yaml"

  pull_request:
    paths:
      - "library/**"
      - ".github/workflows/build-push.yaml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_TAG: ${{ github.sha }}
  PUSH_IMAGES: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:

  # ==========================================
  # JOB 1: LINT AND INTEGRATION TEST
  # ==========================================

  test:
    name: Lint and Integration Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: library
        shell: bash

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Python Lint Check
        run: ruff check . --output-format=github

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Build and Start Application
        run: |
          docker compose up \
            --build \
            --detach \
            --wait \
            --wait-timeout 180

      - name: Integration Smoke Test
        run: python3 tests/smoke_test.py

      - name: Show Logs on Failure
        if: failure()
        run: docker compose logs --no-color

      - name: Cleanup Containers
        if: always()
        run: docker compose down --volumes --remove-orphans


  # ==========================================
  # JOB 2: BUILD AND SCAN DOCKER IMAGES
  # ==========================================

  images:
    name: Build and Scan - ${{ matrix.service }}

    needs: test

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false

      matrix:
        service:
          - auth-service
          - books-service
          - frontend

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # Dockerfile Lint
      # ----------------------------------------

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: library/${{ matrix.service }}/Dockerfile
          failure-threshold: error

      # ----------------------------------------
      # Compute Image Name
      # ----------------------------------------

      - name: Compute Image Name
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::DOCKERHUB_USERNAME is missing"
            exit 1
          fi

          REPO="${DOCKERHUB_USERNAME}/library-${{ matrix.service }}"

          echo "IMAGE_REPO=${REPO,,}" >> "$GITHUB_ENV"

      # ----------------------------------------
      # Docker Buildx
      # ----------------------------------------

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------
      # Build Image
      # ----------------------------------------

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: library/${{ matrix.service }}
          load: true
          push: false
          tags: ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # ----------------------------------------
      # Security Scan
      # ----------------------------------------

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # ----------------------------------------
      # Docker Hub Login
      # ----------------------------------------

      - name: Login to Docker Hub
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------
      # Push Image
      # ----------------------------------------

      - name: Push Docker Image
        if: env.PUSH_IMAGES == 'true'
        uses: docker/build-push-action@v6
        with:
          context: library/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}

      # ----------------------------------------
      # Job Summary
      # ----------------------------------------

      - name: Generate Summary
        if: success()
        shell: bash
        run: |
          echo "## Image Build Report" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: $IMAGE_REPO" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: $IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"

          if [ "$PUSH_IMAGES" = "true" ]; then
            echo "- Status: Pushed to Docker Hub" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Status: Build and Scan only" >> "$GITHUB_STEP_SUMMARY"
          fi
