
name: k8s-cluster

on:
  workflow_dispatch:
    inputs:
      action:
        description: Apply or Destroy infrastructure
        type: choice
        options:
          - apply
          - destroy
        default: apply
        required: true

permissions:
  contents: read

concurrency:
  group: terraform-k8s-cluster
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: eu-west-1

jobs:
  cluster:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # 3. Configure AWS
      - name: Configure AWS
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" \
            --profile user-terraform

          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" \
            --profile user-terraform

          aws configure set region "$AWS_DEFAULT_REGION" \
            --profile user-terraform

      # 4. Terraform Init
      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform validate

      # 5. Verify S3 Remote State
      - name: Verify Terraform State
        working-directory: terraform
        run: |
          terraform state pull > "$RUNNER_TEMP/terraform.tfstate"

          RESOURCE_COUNT=$(jq \
            '[.resources[]?.instances[]?] | length' \
            "$RUNNER_TEMP/terraform.tfstate")

          echo "Resources found in S3 state: $RESOURCE_COUNT"

          if [ "$RESOURCE_COUNT" -eq 0 ]; then
            echo "ERROR: Remote state has no managed resources."
            echo "Refusing to continue to protect existing AWS infrastructure."
            exit 1
          fi

          terraform state list

      # 6. Terraform Apply
      - name: Terraform Apply
        if: inputs.action == 'apply'
        working-directory: terraform
        run: |
          RUNNER_IP=$(curl -4 -s https://api.ipify.org)

          terraform apply \
            -input=false \
            -auto-approve \
            -var "runner_ip=${RUNNER_IP}/32"

      # 7. Terraform Destroy
      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        working-directory: terraform
        run: |
          terraform plan -destroy -input=false

          terraform destroy \
            -input=false \
            -auto-approve

      # 8. Install SSH Key
      - name: Install SSH Key
        if: inputs.action == 'apply'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/key-mo.pem
          chmod 400 ~/key-mo.pem

      # 9. Fill Ansible Inventory
      - name: Fill Ansible Inventory
        if: inputs.action == 'apply'
        working-directory: terraform
        run: |
          IPS=$(terraform output -json public_ips)

          MASTER_PUBLIC=$(echo "$IPS" | jq -r '.master')
          WORKER1_PUBLIC=$(echo "$IPS" | jq -r '.worker1')
          WORKER2_PUBLIC=$(echo "$IPS" | jq -r '.worker2')
          MASTER_PRIVATE=$(terraform output -raw master_private_ip)

          sed -i \
            -e "s/MASTER_PUBLIC_IP/$MASTER_PUBLIC/g" \
            -e "s/MASTER_PRIVATE_IP/$MASTER_PRIVATE/g" \
            -e "s/WORKER1_PUBLIC_IP/$WORKER1_PUBLIC/g" \
            -e "s/WORKER2_PUBLIC_IP/$WORKER2_PUBLIC/g" \
            ../ansible/inventory.yaml

      # 10. Install Ansible
      - name: Install Ansible
        if: inputs.action == 'apply'
        run: |
          pip install ansible

      # 11. Wait for SSH
      - name: Wait for SSH
        if: inputs.action == 'apply'
        working-directory: ansible
        run: |
          for i in $(seq 1 30); do
            if ansible all -m ping; then
              echo "All nodes are reachable."
              exit 0
            fi

            echo "Waiting for nodes..."
            sleep 10
          done

          echo "ERROR: SSH connection failed."
          exit 1

      # 12. Configure Kubernetes
      - name: Run Ansible Playbook
        if: inputs.action == 'apply'
        working-directory: ansible
        run: |
          ansible-playbook hostname.yaml
