
      - name: Save Terraform state after Apply
        if: inputs.action == 'apply' && success()
        uses: actions/upload-artifact@v4
        with:
          name: tfstate
          path: terraform/terraform.tfstate
          retention-days: 90
          if-no-files-found: error

      - name: Delete Terraform state artifact after Destroy
        if: inputs.action == 'destroy' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACTS=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=tfstate&per_page=100")

          echo "$ARTIFACTS" | jq -r '.artifacts[] | .id' | while read ID; do
            gh api -X DELETE \
              "repos/${{ github.repository }}/actions/artifacts/$ID"
          done
