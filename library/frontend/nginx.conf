server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/auth/ {
        proxy_pass http://auth-service:5000;
        proxy_set_header Host $host;
    }

    location /api/books {
        proxy_pass http://books-service:5001;
        proxy_set_header Host $host;
    }
}
