services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    volumes:
      - pgdata:/var/lib/postgresql/data

  auth-service:
    build: ./auth-service
    environment:
      DB_HOST: db
      DB_NAME: library
      DB_USER: library
      DB_PASSWORD: library
      JWT_SECRET: change-me-in-production
    depends_on:
      - db

  books-service:
    build: ./books-service
    environment:
      DB_HOST: db
      DB_NAME: library
      DB_USER: library
      DB_PASSWORD: library
      JWT_SECRET: change-me-in-production
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - books-service

volumes:
  pgdata:
