    ansible_ssh_private_key_file: ~/key-mo.pem
  children:
    master:
      hosts:
        master:
          ansible_host: MASTER_PUBLIC_IP
          private_ip: MASTER_PRIVATE_IP
    workers:
      hosts:
        worker1:
          ansible_host: WORKER1_PUBLIC_IP
        worker2:
          ansible_host: WORKER2_PUBLIC_IP